<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My Landing Page</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f0f2f5; }
    .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
    h1 { color: #333; }
    input { display: block; width: 80%; margin: 10px auto; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    button { background-color: #1A73E8; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to My Landing Page! 🚀</h1>
    <p>Please fill out the form below:</p >
    
    <form action="#">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <button type="submit">Submit</button>
    </form>

  </div>
</body>
</html>
